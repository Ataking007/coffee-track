name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --project-name coffee_track --org com.coffeetrack --platforms android
          sed -i 's/android:label="coffee_track"/android:label="Coffee Track"/' android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Build APKs (one per device type)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-track-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish APKs as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Coffee Track build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk

